<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Moo Rush: Corn to Capitol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#5d9a3f;--pill:rgba(40,25,10,.58);--ink:#3a2412;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2f5a22;--pill:rgba(0,0,0,.62)}}
:root[data-theme="dark"]{--bg:#2f5a22;--pill:rgba(0,0,0,.62)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Baloo 2',ui-rounded,'Segoe UI',system-ui,sans-serif;color:#fff}
#app{position:relative;width:100%;height:100%}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.right{align-items:flex-end}
.pill{display:flex;align-items:center;gap:7px;background:var(--pill);padding:3px 14px 3px 5px;border-radius:999px;font-weight:800;font-size:21px;line-height:1.1}
.pill .ic{width:28px;height:28px;display:grid;place-items:center;font-size:19px}
.coin{border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#f5b921 60%,#c98a12);box-shadow:inset 0 -3px 0 #a8700c}
.num{display:inline-block;transition:transform .12s;padding-top:2px}
.num.bump{transform:scale(1.22)}
#rank{font-size:16px;padding:4px 12px}
#rank small{opacity:.75;font-weight:600;margin-left:4px}
.hide{display:none!important}
#menuBtn{pointer-events:auto;border:0;background:var(--pill);color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
button:focus-visible{outline:3px solid #ffe066;outline-offset:3px}
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,40,10,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{background:#fff8e7;color:var(--ink);border-radius:26px;padding:22px 22px 20px;max-width:350px;width:calc(100% - 36px);text-align:center;box-shadow:0 10px 0 #d9c49a,0 24px 40px rgba(0,0,0,.3)}
.card h1{margin:0;font-size:46px;line-height:.95;color:#f0a020;text-shadow:0 4px 0 #a5560f}
.card h2{margin:2px 0 0;font-size:30px;line-height:1.05;color:#3a2412}
.card .ch{font-weight:800;color:#8a6a3a;font-size:15px;margin-top:4px}
.card .big{font-size:58px;line-height:1.1;margin:4px 0}
.card p{margin:9px 0;font-weight:600;font-size:16px;line-height:1.35}
.card .goal{background:#f3e3bf;border-radius:14px;padding:8px 10px;font-weight:800}
.ladder{font-size:22px;letter-spacing:1px;margin:8px 0}
.card button{margin-top:8px;border:0;background:#4caf50;color:#fff;font:inherit;font-weight:800;font-size:24px;padding:7px 38px;border-radius:18px;box-shadow:0 6px 0 #2e7d32;cursor:pointer}
.card button.alt{background:#c9b48a;box-shadow:0 6px 0 #9c8760;font-size:17px;padding:6px 20px;margin-left:6px}
.card button:active{transform:translateY(4px);box-shadow:0 2px 0 #2e7d32}
#cheatIn{width:100%;font:inherit;font-size:22px;font-weight:800;text-align:center;padding:8px;border-radius:12px;border:3px solid #d9c49a;background:#fff;color:#3a2412;text-transform:uppercase;margin:6px 0}
.ver{font-size:12px;color:#9a8a6a;font-weight:700;margin-top:6px}
#menu{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(255,236,170,.55),rgba(40,80,20,.75));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:5}
#menuBody{background:#fff8e7;color:#3a2412;border-radius:28px;padding:22px 18px 16px;width:min(380px,calc(100% - 28px));max-height:calc(100% - 28px);overflow-y:auto;text-align:center;box-shadow:0 10px 0 #d9c49a,0 24px 50px rgba(0,0,0,.35)}
.logo{font-size:54px;font-weight:800;line-height:.95;color:#f0a020;text-shadow:0 4px 0 #a5560f,0 8px 14px rgba(0,0,0,.18)}
.tag{font-weight:800;color:#8a6a3a;margin-top:2px}
#menuBody h2{margin:0 0 12px;font-size:26px}
.mbtn{display:block;width:100%;margin:8px 0;border:0;border-radius:16px;padding:10px 14px;font:inherit;font-weight:800;font-size:19px;color:#fff;background:#4caf50;box-shadow:0 5px 0 #2e7d32;cursor:pointer}
.mbtn small{display:block;font-size:13px;font-weight:600;opacity:.9}
.mbtn.big{font-size:23px;padding:12px 14px;background:#f0a020;box-shadow:0 5px 0 #a5560f}
.mbtn.ghost{background:#e9dcbc;color:#5a4426;box-shadow:0 4px 0 #c9b48a}
.mbtn.warn{background:#e0763a;box-shadow:0 5px 0 #9c4a1c}
.mbtn:active{transform:translateY(3px);box-shadow:none}
.slot{background:#f3e3bf;border-radius:18px;padding:10px 12px;margin:10px 0;text-align:left}
.slot.cur{outline:3px solid #f0a020}
.sh{font-size:17px}.badge{background:#f0a020;color:#fff;border-radius:999px;padding:1px 8px;font-size:12px}
.sd{display:flex;gap:10px;align-items:center;font-weight:700;margin:6px 0}.sd .r{font-size:34px}.sd small{font-weight:600;color:#7a6440}.sd.empty{color:#9a8a6a}
.srow{display:flex;gap:8px}.srow .mbtn{margin:4px 0;font-size:16px;padding:8px}
.lvl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:#f3e3bf;border-radius:16px;padding:8px 12px;margin:6px 0;font:inherit;color:#3a2412;cursor:pointer}
.lvl .r{font-size:30px}.lvl small{color:#7a6440;font-weight:600}.lvl.locked{opacity:.55;cursor:default}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f3e3bf;border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:800;text-align:left}
.set.col{flex-direction:column;align-items:stretch}.set .mbtn{width:auto;margin:0;font-size:16px;padding:6px 14px}
.tog{border:0;border-radius:999px;padding:6px 16px;font:inherit;font-weight:800;background:#c9b48a;color:#fff;cursor:pointer;min-width:64px}.tog.on{background:#4caf50}
.seg{display:flex;gap:4px}.seg button{border:0;border-radius:10px;padding:6px 9px;font:inherit;font-weight:800;font-size:14px;background:#e9dcbc;color:#5a4426;cursor:pointer}.seg button.on{background:#4caf50;color:#fff}
.cheat{display:flex;gap:8px}.cheat input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:17px;padding:6px 10px;border-radius:10px;border:2px solid #d9c49a;text-transform:uppercase}
.help{text-align:left}.help p{margin:8px 0;font-weight:600;line-height:1.35}
.note{font-weight:600;color:#7a6440}
#goals{pointer-events:auto;background:var(--pill);border-radius:14px;padding:5px 10px;font-size:12px;font-weight:700;max-width:190px;cursor:pointer}
#goals .gt{font-weight:800;font-size:13px;opacity:.85}
#goals .g{display:flex;gap:6px;align-items:flex-start;margin-top:3px;line-height:1.2}
#goals .g.done{opacity:.55;text-decoration:line-through}
#goals.min .g{display:none}
.pill{white-space:nowrap}
#rank{max-width:190px}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="col">
      <div class="pill" id="moneyPill" style="pointer-events:auto;cursor:pointer"><span class="ic coin"></span><span class="num" id="money">0</span></div>
      <div class="pill hide" id="votesPill"><span class="ic">🗳️</span><span class="num" id="votes">0</span></div>
      <div class="pill hide" id="evPill"><span class="ic">⭐</span><span class="num" id="ev">0</span><small style="opacity:.7;font-size:15px">/270</small></div>
      <div id="goals" class="min"></div>
    </div>
    <div class="col right">
      <div class="pill" id="rank">👦 Farm Kid</div>
      <div class="pill" id="timePill" style="font-size:15px;padding:3px 12px">☀️ Day 1</div>
      <div class="pill hide" id="saved" style="font-size:14px;padding:3px 12px">✓ Saved</div>
      <button id="menuBtn" title="Menu" aria-label="Open menu">☰</button>
    </div>
  </div>
  <button id="dashBtn" aria-label="Dash" style="position:absolute;right:14px;bottom:62px;width:64px;height:64px;border-radius:50%;border:0;background:rgba(40,25,10,.6);color:#fff;font-size:28px;pointer-events:auto;touch-action:none">💨</button>
  <div id="menu"><div id="menuBody"></div></div>
  <div id="modal"><div class="card" id="card"></div></div>
</div>

/* belts: physical conveyor from a field to a machine hopper in the same row */
function makeBelt(m){
 const src=mods.find(f=>f.d===m.d&&f.type==='field'&&f.item===m.in&&f.r===m.r&&Math.abs(f.c-m.c)===1);
 if(!src)return null;
 const y=m.inPad.y+m.inPad.h/2,left=src.c<m.c;
 const x1=left?src.rect.x+src.rect.w+10:src.rect.x-10,x2=left?m.inPad.x+8:m.inPad.x+m.inPad.w-8;
 const b={m,src,x1,x2,y,dir:Math.sign(x2-x1),len:Math.abs(x2-x1),items:[],item:m.in,speed:75,gap:20};
 b.start={x:x1-(left?36:-2)-(left?0:34),y:y-30,w:36,h:60};
 b.start=left?{x:x1-34,y:y-34,w:44,h:68}:{x:x1-10,y:y-34,w:44,h:68};
 belts.push(b);return b;
}
const beltRoom=b=>b.items.length===0||b.items[b.items.length-1]>=b.gap;
function beltPush(b,fromX,fromY){b.items.push(0);fly(b.item,fromX,fromY,()=>({x:b.x1,y:b.y+4}),null,0.18);}
function updBelt(b,dt){
 for(let i=0;i<b.items.length;i++){
  const lim=i===0?b.len:b.items[i-1]-b.gap;
  b.items[i]=Math.min(lim,b.items[i]+b.speed*dt);
 }
 if(b.items.length&&b.items[0]>=b.len&&b.m.hopper.n<b.m.hopper.cap){
  b.items.shift();const h=b.m.hopper,idx=h.n;h.n++;
  fly(b.item,b.x2,b.y,()=>pilePos(h.rect,idx,h.type),h,0.3);
 }
}
function mkHelper(src,dst,i,belt){

 if(src.type==='field'){H.field=src;H.fromStand=ctr(src.rect);}else{H.from=src.tray;H.fromStand=src.stand;}
 if(belt){H.belt=belt;H.toStand={x:belt.x1-belt.dir*22,y:belt.y+16};H.cap=8;}
 else if(dst.type==='machine'){H.to=dst.hopper;H.toStand=ctr(dst.inPad);}
 else{H.to=dst.box;H.toStand=ctr(dst.drop);}
 H.x=H.fromStand.x;H.y=H.fromStand.y;return H;
}

  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const o=cellXY(d,c,r);cells.push({d,c,r,x:o.x,y:o.y,w:CW,h:CHh,mod:null,fog:1,seed:(d*27+r*9+c)*7919});}

function applyPad(p,fromLoad){
 const m=p.m?modBy(p.d,p.m):null;
 switch(p.fx){
  case 'feed':{const b=makeBelt(m);if(b)helpers.push(mkHelper(b.src,m,helpers.length,b));break;}
  case 'cap':S.cap=Math.max(S.cap,p.v+4*ulv('cap'));break;
  case 'more':m.n+=p.v;syncUnits(m);break;
  case 'price':m.price=Math.round(m.price*p.v);break;
  case 'unlock':{const t=modBy(p.d,p.t);t.locked=false;syncUnits(t);break;}
  case 'helper':helpers.push(mkHelper(modBy(p.d,p.f),modBy(p.d,p.t),helpers.length,null));break;
  case 'state':S.ev+=p.v;if(!fromLoad&&S.ev>=270&&!S.won){S.won=true;save(true);setTimeout(showEnding,900);}break;
  case 'gate':if(!fromLoad)setTimeout(nextStage,600);break;
  case 'vehicle':S.veh=Math.max(S.veh,p.v);if(!fromLoad)say(player,pick(['Vroom vroom!','Look at me go!','Wheee!']),2);break;
  case 'boat':S.boat=Math.max(S.boat,p.v);if(!fromLoad)say(player,'Ahoy! ⚓',2);break;
  case 'dog':S.dog=true;break;
  case 'gun':S.gun=Math.max(S.gun,p.v);if(!fromLoad)say(player,pick(['Pew pew! 🥛','Stay back, zombies!','Locked and loaded']),2);break;
  case 'turret':S.turret=Math.max(S.turret,p.v);break;
  case 'lights':S.lights=true;break;
  case 'collector':S.col=Math.max(S.col,p.v);break;
 }
}
function visiblePads(){
 const out=[];
 for(let d=0;d<AREAS.length;d++){if(!areaOpen(d))continue;let n=0;const grp={};for(const p of pads){if(p.d!==d||p.paid>=p.cost)continue;
  if(p.fx==='state'){if(!modBy(d,p.m).locked)out.push(p);continue;}
  if(p.grp){grp[p.grp]=(grp[p.grp]||0)+1;if(grp[p.grp]<=1)out.push(p);continue;}
  if(n<3){out.push(p);n++;}}}
 return out;
}
const wallet=c=>c==='vote'?S.votes:S.money;
/* reveal: what part of the world exists for the player right now */
function computeReveal(){
 const vp=visiblePads();
 for(const c of cells){
  let on=false;const m=c.mod;
  if(areaOpen(c.d)){
   if(m){if(m.type==='gate')on=pads.some(p=>p.d===m.d&&p.fx==='gate'&&(p.paid>=p.cost||vp.includes(p)));
    else if(m.type==='landmark'||m.type==='debate'||m.type==='armory'||m.type==='bank'||m.type==='garage'||m.type==='dock'||m.type==='lighthouse')on=true;
    else on=!m.locked||vp.some(p=>p.fx==='unlock'&&p.d===m.d&&p.t===m.id);}
   else on=cells.some(k=>k.d===c.d&&k.mod&&active(k.mod)&&Math.abs(k.c-c.c)+Math.abs(k.r-c.r)===1);
  }
  c.on=on;
 }
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(const c of cells)if(c.on){x0=Math.min(x0,c.x);y0=Math.min(y0,c.y);x1=Math.max(x1,c.x+c.w);y1=Math.max(y1,c.y+c.h);}
 targetBounds={x0:x0,y0:y0,x1:x1,y1:y1};
 refreshObstacles();
}

function stackPos(e,i){const t=e.stack.type||'milk';return {x:e.x+e.face*12,y:e.y-22-i*ITEMS[t].sh};}
function fly(type,x,y,to,dest,dur=0.24){if(dest)dest.inc++;flyers.push({type,x1:x,y1:y,to,dest,t:0,dur});}
function take(src,e){src.n--;const st=e.stack;st.type=src.type;st.n++;const idx=st.n-1;const f=pilePos(src.rect,src.n,src.type);fly(src.type,f.x,f.y,()=>stackPos(e,idx),st);}
function give(e,dst){const st=e.stack;st.n--;const idx=dst.n;dst.n++;const f=stackPos(e,st.n);fly(st.type,f.x,f.y,()=>pilePos(dst.rect,idx,dst.type),dst);if(st.n<=0){st.n=0;st.type=null;}}
function harvest(tile,e,item){tile.t=REGROW;const st=e.stack;st.type=item;st.n++;const idx=st.n-1;fly(item,tile.x,tile.y-12,()=>stackPos(e,idx),st);}
function giveBelt(e,b){const st=e.stack;st.n--;const f=stackPos(e,st.n);beltPush(b,f.x,f.y);if(st.n<=0){st.n=0;st.type=null;}}
function moveTo(e,tx,ty,sp,dt){const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d<1){e.moving=false;return true;}const s=Math.min(d,sp*dt);e.x+=dx/d*s;e.y+=dy/d*s;e.moving=true;e.walk+=dt*10;if(Math.abs(dx)>0.5)e.face=dx>0?1:-1;return d<4;}
function collide(e,r){const R=12,cx=clamp(e.x,r.x,r.x+r.w),cy=clamp(e.y,r.y,r.y+r.h),dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy);if(d>=R)return;
 if(d===0){const l=e.x-r.x,rt=r.x+r.w-e.x,t=e.y-r.y,b=r.y+r.h-e.y,mm=Math.min(l,rt,t,b);if(mm===l)e.x=r.x-R;else if(mm===rt)e.x=r.x+r.w+R;else if(mm===t)e.y=r.y-R;else e.y=r.y+r.h+R;}else{e.x=cx+dx/d*R;e.y=cy+dy/d*R;}}
let warnT=0;

function act(){

 for(const m of mods){
  if(!active(m)||Math.abs(m.ox+CW/2-p.x)>CW||Math.abs(m.oy+CHh/2-p.y)>CHh)continue;

  if(m.tray&&inR(p,m.tray.rect,14)&&avail(m.tray)>0){if(canTake(m.tray.type)){if(destsFor(m.tray.type,live(),true).length){take(m.tray,p);sfx('pick');}else if(!st.type)warn('Nobody needs '+icon(m.tray.type)+' right now');}else if(st.type&&st.type!==m.tray.type)warn('Hands full — drop the '+icon(st.type)+' first');}

  if(m.type==='counter'){
   if(inR(p,m.drop)&&st.type){if(st.type===m.item){if(m.box.n<m.box.cap){give(p,m.box);sfx('drop');}}else warn(m.name+' sells '+icon(m.item));}
   const c=m.cash,a=avail(c);
   if(a>0&&inR(p,c.rect,8)){const k=Math.min(a,Math.max(1,Math.ceil(a/6)));const part=c.n<=k?c.val:Math.round(c.val*k/c.n);c.n-=k;c.val-=part;
    if(c.type==='vote')S.votes+=part;else S.money+=part;bump(c.type);coinSound();
    const f=pilePos(c.rect,c.n,c.type);fly(c.type,f.x,f.y,()=>({x:p.x,y:p.y-60}),null,0.2);}
  }
 }
 for(const m of mods)if(m.bin&&active(m)&&st.type&&st.n>0&&inR(p,m.bin,22)){st.n--;const f=stackPos(p,st.n),c=ctr(m.bin);fly(st.type,f.x,f.y,()=>c,null,0.2);if(st.n<=0){st.n=0;st.type=null;}break;}

   if(pd.fx==='state')toast('You won '+pd.name+'! +'+pd.v+' ⭐',2.6);else if(pd.fx==='gun')toast(S.gun===1?'🔫 Drag on the RIGHT side of the screen to aim & shoot (computer: mouse + click). Tap = quick shot!':'New weapon: '+pd.name+'!',4.5);else if(pd.fx!=='gate')toast('Unlocked: '+pd.name+'!',2.4);
   if(pd.fx==='unlock'){const t=modBy(pd.d,pd.t);focusOn(t.ox+CW/2,t.oy+CHh/2,1.3);}shake(5);}
 }

const NAV={s:20,nx:0,ny:0,blk:null};
function buildNav(){
 const s=NAV.s;NAV.nx=Math.ceil(W/s);NAV.ny=Math.ceil(H/s);const blk=new Uint8Array(NAV.nx*NAV.ny);
 for(let gy=0;gy<NAV.ny;gy++)for(let gx=0;gx<NAV.nx;gx++){const x=gx*s+s/2,y=gy*s+s/2;if(blockedAt(x,y,14))blk[gy*NAV.nx+gx]=1;}

}
function navFree(gx,gy){return gx>=0&&gy>=0&&gx<NAV.nx&&gy<NAV.ny&&!NAV.blk[gy*NAV.nx+gx];}

function findPath(ax,ay,bx,by){
 const s=NAV.s,nx=NAV.nx;
 if(lineFree(ax,ay,bx,by))return [{x:bx,y:by}];
 const [sx,sy]=nearestFree(Math.floor(ax/s),Math.floor(ay/s)),[tx,ty]=nearestFree(Math.floor(bx/s),Math.floor(by/s));
 const N=nx*NAV.ny,g=new Float32Array(N).fill(1e9),from=new Int32Array(N).fill(-1),closed=new Uint8Array(N);
 const heap=[];const push=(i,f)=>{heap.push([f,i]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
 const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top;};
 const H=(x,y)=>{const dx=Math.abs(x-tx),dy=Math.abs(y-ty);return dx+dy-0.59*Math.min(dx,dy);};
 const si=sy*nx+sx,ti=ty*nx+tx;g[si]=0;push(si,H(sx,sy));let it=0;
 while(heap.length&&it++<60000){const [,i]=pop();if(closed[i])continue;closed[i]=1;if(i===ti)break;const x=i%nx,y=(i-x)/nx;
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(!navFree(X,Y))continue;if(dx&&dy&&(!navFree(x+dx,y)||!navFree(x,y+dy)))continue;
   const j=Y*nx+X,ng=g[i]+(dx&&dy?1.41:1);if(ng<g[j]){g[j]=ng;from[j]=i;push(j,ng+H(X,Y));}}}
 if(from[ti]<0&&ti!==si)return null;
 const pts=[];for(let i=ti;i!==si&&i>=0;i=from[i])pts.push({x:(i%nx)*s+s/2,y:Math.floor(i/nx)*s+s/2});pts.reverse();pts.push({x:bx,y:by});
 // smooth: skip waypoints we can see past
 const out=[];let cx=ax,cy=ay,k=0;while(k<pts.length){let j=pts.length-1;while(j>k&&!lineFree(cx,cy,pts[j].x,pts[j].y))j--;out.push(pts[j]);cx=pts[j].x;cy=pts[j].y;k=j+1;}

function walkTo(h,tx,ty,sp,dt){

/* the open world = revealed cells (plus the paths between them); you can never walk into the clouds */
function walkable(x,y){

 for(const c of cells){
  if(x<c.x-50||x>c.x+c.w+50||y<c.y-50||y>c.y+c.h+50)continue;

 if(ch>=3){l.vest=null;l.shirt=ch>=5?'#2f3b55':'#4a6fa5';l.pants=ch>=5?'#2f3b55':'#3d3d5c';}

}

 for(let k=0;k<w;k+=16){const x=b.dir>0?x0+((k+off)%w):x0+w-((k+off)%w);ctx.beginPath();ctx.moveTo(x,y-11);ctx.lineTo(x,y+7);ctx.stroke();}

function drawPad(pd){
 const prog=pd.paid/pd.cost,state=pd.fx==='state',gate=pd.fx==='gate';
 const base=state?'#2f5fbf':gate?'#d08a1a':'#3c8a3c',fill=state?'#5f8fef':gate?'#f5b942':'#6cc46c',edge=state?'#1f3f8f':gate?'#8a5a10':'#2a6a2a';
 const can=wallet(pd.cur)>=pd.cost-pd.paid,pulse=can?1+Math.sin(T*6)*0.03:1;
 ctx.save();const c=ctr(pd);ctx.translate(c.x,c.y);ctx.scale(pulse,pulse);ctx.translate(-c.x,-c.y);
 ctx.fillStyle='rgba(0,0,0,.18)';rr(pd.x+2,pd.y+5,pd.w,pd.h,12);ctx.fill();
 ctx.fillStyle=base;rr(pd.x,pd.y,pd.w,pd.h,12);ctx.fill();
 if(prog>0){ctx.save();rr(pd.x,pd.y,pd.w,pd.h,12);ctx.clip();ctx.fillStyle=fill;ctx.fillRect(pd.x,pd.y+pd.h*(1-prog),pd.w,pd.h*prog);ctx.restore();}
 ctx.strokeStyle=can?'#ffe14d':edge;ctx.lineWidth=3;rr(pd.x,pd.y,pd.w,pd.h,12);ctx.stroke();
 drawItem(pd.icon,c.x,c.y+(gate?6:2),gate?1.5:0.95);
 drawItem(pd.cur,c.x-24,pd.y+pd.h-6,0.8);

  h+='<div class="set"><span>🔍 Camera</span><span class="seg">'+['close','normal','far'].map(z=>'<button class="'+(SET.zoom===z?'on':'')+'" data-act="zoom:'+z+'">'+z[0].toUpperCase()+z.slice(1)+'</button>').join('')+'</span></div>';

  h+='<div class="set"><span>💾 Save</span>'+btn('savenow','Save now')+'</div>';

  h+='<h2>How to play</h2><div class="help"><p>👆 <b>Drag anywhere</b> to walk (or WASD / arrow keys on a computer).</p><p>🌽 Walk through a field to <b>harvest</b>. Walk over a tray to <b>pick up</b>. Walk onto a dashed pad to <b>drop off</b>.</p><p>🐄 Animals and machines turn what you bring into something worth more. Customers pay at the counters — walk over the coins to collect them.</p><p>🟩 Stand on a <b>green pad</b> to pay for an upgrade. The <b>gold pad</b> takes you to the next chapter and opens new land.</p><p>🌳 Trees, ponds, pens, counters and trucks are solid — walk around them. Clouds hide land you have not unlocked yet.</p><p>🚲 Buy <b>vehicles</b> at the Vehicle shop to move faster — up to a jetpack that flies over everything.</p><p>⚓ The <b>Harbor</b> lake opens in chapter 2. Buy a boat at the dock to fish, make sushi and dive for pearls.</p><p>🦝 <b>Robbers</b> hide in bushes and chase you. If they catch you, coins fly out — grab them back! Tackle a robber carrying a sack to get your money back. Run away (or hop in a boat) and they give up. A guard dog scares them off.</p><p>🧟 <b>Customers who wait too long turn green… then into zombies</b> that chase you! Buy a weapon at the <b>Farm armory</b>: it shoots whatever you are carrying (milk, eggs, corn…) and cures zombies, who pay you double. At night customers turn twice as fast. Every 3rd night is a 🩸 <b>blood moon</b> horde.</p><p>💰 Each shop cash spot has a meter. When it is nearly full a <b>red arrow</b> calls you. If it overflows, coins spill and zombies eat them! A collector from the <b>Bank</b> fetches money for a cut.</p><p>🎯 New <b>goals</b> every morning. ⭐ Fast service raises shop stars (more customers). Watch for 👑 VIPs, 👵 grannies and the food critic!</p><p>🗑 Holding something you can\'t use? Drop it in a <b>Toss</b> bin.</p><p>🏆 Climb from Farm Kid to President of the USA!</p></div>'+btn('main','← Back','ghost');

menuEl.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const [a,arg]=b.dataset.act.split(':');sfx('drop');
 if(a==='resume'){if(!readSlot(curSlot))return showMenu('main');hideMenu();}

 else if(['slots','levels','settings','help','main','wardrobe','udders'].includes(a)){delArm=0;showMenu(a);}
 else if(a==='play')startSlot(+arg);

 else if(a==='over'){if(delArm===-+arg){delArm=0;deleteSlot(+arg);startSlot(+arg);}else{delArm=-+arg;b.textContent='Tap again to erase it';}}
 else if(a==='del'){if(delArm===+arg){delArm=0;deleteSlot(+arg);showMenu(menuScreen);}else{delArm=+arg;showMenu(menuScreen);}}

 else if(a==='perk'){const P=UDDER_PERKS.find(x=>x.k===arg),lv=ulv(arg),cost=lv+1;if(P&&lv<P.max&&(S.udders||0)>=cost){S.udders-=cost;S.perks=S.perks||{};S.perks[arg]=lv+1;if(arg==='cap')S.cap+=4;save(true);sfx('unlock');}showMenu('udders');}
 else if(a==='retire'){if(delArm===-99){delArm=0;retire();hideMenu();stageCard();toast('🌾 Retired to the farm! Your perks are active.',3);}else{delArm=-99;showMenu('udders');}}
 else if(a==='tog'){SET[arg]=!SET[arg];saveSettings();showMenu('settings');}
 else if(a==='zoom'){SET.zoom=arg;saveSettings();resize();snapCam();showMenu('settings');}

function travelTo(i){
 const first=mods.find(m=>m.d===i&&active(m));if(!first)return;
 const c=ctr(first.cell);let x=c.x,y=i===HD?first.oy+250:first.oy+CHh-30;
 if(blockedAt(x,y)){const f=nearestFree(Math.floor(x/NAV.s),Math.floor(y/NAV.s));x=f[0]*NAV.s+NAV.s/2;y=f[1]*NAV.s+NAV.s/2;}
 player.x=x;player.y=y;snapCam();toast('Welcome to '+AREAS[i].title+(i===HD?'':' land'),2);
}

function openCheats(){

function applyCheat(raw){
 const c=String(raw||'').trim().toUpperCase();let msg=null;
 if(c==='MOOLAH'){S.money+=1000;msg='+1,000 coins 🪙';}
 else if(c==='RICH'){S.money+=100000;msg='+100,000 coins 🪙';}
 else if(c==='BILLIONAIRE'){S.money+=10000000;msg='+10,000,000 coins 🪙';}
 else if(c==='VOTES'){S.votes+=10000;msg='+10,000 votes 🗳️';}
 else if(c==='NEXT'){const gp=pads.find(p=>p.d===S.ch&&p.fx==='gate'&&p.paid<p.cost);if(gp){gp.paid=gp.cost;computeReveal();save(true);setTimeout(nextStage,300);msg='Skipping to the next chapter…';}else msg='No next chapter here';}
 if(msg){bump('coin');updateHud(true);save(true);toast(msg,2.5);}else toast('Unknown code',2);
}

function modal(html,btn,cb,alt,altCb){
 paused=true;keys.clear();joy=null;

function goalText(){const st=STAGES[S.ch],g=st.pads.find(p=>p.fx==='gate');if(g)return 'Goal: '+g.name+' — '+fmt(g.cost)+' '+(g.cur==='vote'?'🗳️ votes':'🪙');return 'Goal: win 270 ⭐ electoral votes';}
function ladder(){return STAGES.map((c,i)=>i<S.ch?'✅':i===S.ch?c.rank:'▫️').join(' ')+' 👑';}
function stageCard(){
 const st=STAGES[S.ch];
 modal('<div class="ch">Chapter '+(S.ch+1)+' of '+STAGES.length+'</div><div class="big">'+st.rank+'</div><h2>'+st.title+'</h2><p>'+st.intro+'</p><p class="goal">'+goalText()+'</p><div class="ladder">'+ladder()+'</div>',"Let's go",()=>toast(S.ch===0?'Walk into the corn to harvest it 🌽':'New land unlocked — follow the arrow',3));
}
function nextStage(){
 if(S.ch>=STAGES.length-1)return;
