<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#2f5a22}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script>
/* Moo Rush cast options. Throwaway preview, same primitives as prototype/index.html (rr/ell/circ/text, drawPerson geometry). */
const C=document.getElementById('c'),ctx=C.getContext('2d');
const FONT="'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif";
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function text(t,x,y,size,fill,stroke,weight=800,align='center'){ctx.font=weight+' '+size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='middle';if(stroke){ctx.lineJoin='round';ctx.lineWidth=size/4;ctx.strokeStyle=stroke;ctx.strokeText(t,x,y);}ctx.fillStyle=fill;ctx.fillText(t,x,y);}
function fill(c){ctx.fillStyle=c;ctx.fill();}
function line(pts,c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.stroke();}
function emoji(e,x,y,s){ctx.font=(s||20)+'px "Apple Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(e,x,y);}
function bubble(t,x,y,size){size=size||12;ctx.font='800 '+size+'px '+FONT;const w=ctx.measureText(t).width+14;ctx.fillStyle='#fff';rr(x-w/2,y-size,w,size*2,size);ctx.fill();ctx.beginPath();ctx.moveTo(x-4,y+size-1);ctx.lineTo(x,y+size+6);ctx.lineTo(x+4,y+size-1);ctx.fill();text(t,x,y+1,size,'#3a2412');}
const INK='#2b1d14',SHOE='#3a2a20',ZSKIN='#7fb04a';

/* ---- the person: drawPerson geometry with knobs. Defaults reproduce the prototype exactly. ---- */
function person(x,y,o){
 const f=o.face||1,legH=o.legH||16,bodyH=o.bodyH||22,bodyW=o.bodyW||20,hr=o.headR||10,neck=o.neck||0,sw=o.stride||0;
 const hip=y-legH,top=hip-bodyH+2,hx=x+(o.lean||0)*f,hy=top-hr-neck;const g={x,y,f,hip,top,hx,hy,hr,bodyW,bodyH,legH};
 if(o.ring){ctx.strokeStyle=o.ring;ctx.lineWidth=3;ell(x,y,20,7);ctx.stroke();}
 ctx.fillStyle='rgba(0,0,0,.18)';ell(x,y,Math.max(13,bodyW*.65),5);ctx.fill();
 if(o.under)o.under(g);
 const lw=bodyW*.35;ctx.fillStyle=o.legs||o.pants;
 if(o.shorts){ctx.fillStyle=o.skin;rr(x-bodyW*.4+1,hip-1-Math.max(0,sw),lw-2,legH,3);ctx.fill();rr(x+bodyW*.05+1,hip-1-Math.max(0,-sw),lw-2,legH,3);ctx.fill();ctx.fillStyle=o.pants;rr(x-bodyW*.42,hip-2,bodyW*.84,legH*.5,3);ctx.fill();}
 else{rr(x-bodyW*.4,hip-1-Math.max(0,sw),lw,legH,3);ctx.fill();rr(x+bodyW*.05,hip-1-Math.max(0,-sw),lw,legH,3);ctx.fill();}
 ctx.fillStyle=o.shoes||SHOE;rr(x-bodyW*.45,y-4-Math.max(0,sw),lw+2,5,2);ctx.fill();rr(x,y-4-Math.max(0,-sw),lw+2,5,2);ctx.fill();
 ctx.fillStyle=o.shirt;if(o.round){ell(x,top+bodyH/2,bodyW/2,bodyH/2+1);ctx.fill();}else if(o.vshape){ctx.beginPath();ctx.moveTo(x-bodyW/2-6,top);ctx.lineTo(x+bodyW/2+6,top);ctx.lineTo(x+bodyW*.3,top+bodyH);ctx.lineTo(x-bodyW*.3,top+bodyH);ctx.closePath();ctx.fill();}else{rr(x-bodyW/2,top,bodyW,bodyH,7);ctx.fill();}
 if(o.torso)o.torso(g);
 if(o.vest){ctx.fillStyle=o.vest;rr(x-bodyW/2,top+1,6,bodyH-3,3);ctx.fill();rr(x+bodyW/2-6,top+1,6,bodyH-3,3);ctx.fill();}
 if(o.tie){ctx.fillStyle=o.tie;ctx.beginPath();ctx.moveTo(x-2,top+1);ctx.lineTo(x+2,top+1);ctx.lineTo(x+3,top+16);ctx.lineTo(x,top+19);ctx.lineTo(x-3,top+16);ctx.fill();}
 if(o.sash){ctx.save();rr(x-bodyW/2,top,bodyW,bodyH,7);ctx.clip();ctx.strokeStyle=o.sash;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x-bodyW/2-2,top);ctx.lineTo(x+bodyW/2+2,top+bodyH);ctx.stroke();ctx.restore();}
 if(!o.zombie&&!o.noHands){ctx.fillStyle=o.skin;circ(x-bodyW/2-1+(o.vshape?-5:0),top+14,3.5);ctx.fill();circ(x+bodyW/2+1+(o.vshape?5:0),top+14,3.5);ctx.fill();}
 if(neck){ctx.fillStyle=o.skin;ctx.fillRect(hx-3,hy+hr-3,6,neck+4);}
 if(o.headFn)o.headFn(g);else{
  ctx.fillStyle=o.skin;circ(hx,hy,hr);ctx.fill();
  hair(g,o);
  if((o.eyes||'').startsWith('z')&&o.eyes!=='zgoogly')zface(g,o.eyes,o);else eyes(g,o.eyes||'dot',o);
  mouth(g,o.mouth);
 }
 if(o.hatFn)o.hatFn(g);
 if(o.after)o.after(g);
 if(o.zombie){ctx.fillStyle=o.skin;const ay=top+8+(o.armY||0);rr(x+f*4-(f<0?18:0),ay,18,6,3);ctx.fill();rr(x+f*4-(f<0?18:0),ay+7,18,6,3);ctx.fill();}
 return g;
}
function hair(g,o){const {hx,hy,hr,f}=g,c=o.hair,s=hr/10,st=o.hairStyle||'std';ctx.fillStyle=c;
 if(st==='bald'){ctx.fillStyle=c;ell(hx-hr+1,hy+1,3,5);ctx.fill();ell(hx+hr-1,hy+1,3,5);ctx.fill();return;}
 if(st==='none')return;
 if(st==='bouffant'){const v=o.puff||0;ell(hx-f*1,hy-hr*.55-v*.45,hr*1.08+v*.35,hr*.6+v*.6);ctx.fill();}
 if(st==='quiff'){ctx.beginPath();ctx.moveTo(hx-f*hr,hy-2);ctx.quadraticCurveTo(hx-f*hr,hy-hr-6*s,hx+f*2,hy-hr-9*s);ctx.quadraticCurveTo(hx+f*(hr+9*s),hy-hr-10*s,hx+f*(hr+6*s),hy-hr*.4);ctx.quadraticCurveTo(hx+f*4,hy-hr*.7,hx-f*hr,hy-2);ctx.fill();}
 if(st==='corn'){const cx=hx-f*1,cy=hy-hr-7*s;ctx.fillStyle='#3d8b37';ctx.beginPath();ctx.moveTo(hx-hr,hy+3);ctx.quadraticCurveTo(hx-hr-6*s,hy-hr,cx-3,cy+4);ctx.lineTo(hx-hr+3,hy);ctx.fill();ctx.beginPath();ctx.moveTo(hx+hr,hy+3);ctx.quadraticCurveTo(hx+hr+6*s,hy-hr,cx+3,cy+4);ctx.lineTo(hx+hr-3,hy);ctx.fill();
  ctx.fillStyle='#f2c230';ell(cx,cy,hr*.8,hr*1.35);ctx.fill();ctx.fillStyle='#d9a21b';for(let r=-3;r<=3;r++)for(let k=-1;k<=1;k++){circ(cx+k*4*s,cy+r*3.6*s,1.1*s);ctx.fill();}
  ctx.fillStyle='#f2c230';ctx.beginPath();ctx.arc(hx,hy-1,hr+.6,Math.PI*1.05,Math.PI*1.95);ctx.fill();return;}
 if(st==='karen'){const k=o.karen||1;ell(hx-f*6*k,hy-9*k,15*k,10*k);ctx.fill();ell(hx+f*6*k,hy-14*k,11*k,8*k);ctx.fill();ell(hx-f*hr,hy+2,5,9*k);ctx.fill();return;}
 if(st==='curlers'){ctx.beginPath();ctx.arc(hx,hy-1,hr+.6,Math.PI*1.05,Math.PI*1.95);ctx.fill();const cc=['#ff8fb8','#7ec8ff','#ffd35a'];for(let i=0;i<3;i++){ctx.fillStyle=cc[i];rr(hx-9+i*6,hy-hr-4,5,7,2);ctx.fill();}return;}
 ctx.beginPath();ctx.arc(hx,hy-1,hr+.6,Math.PI*1.05,Math.PI*1.95);ctx.lineTo(hx+hr,hy-2);ctx.fill();
 if(o.bun){circ(hx-f*8*s,hy-7*s-(o.bunR||5.5)*.0,o.bunR||5.5);ctx.fill();}
}
function eyes(g,st,o){const {hx,hy,hr,f}=g,s=hr/10,ey=hy+1*s;
 if(st==='x'){ctx.strokeStyle=INK;ctx.lineWidth=1.5;for(const dx of[-2.6,2.6]){const ex=hx+f*3*s+dx*s;ctx.beginPath();ctx.moveTo(ex-1.5,ey-1.5);ctx.lineTo(ex+1.5,ey+1.5);ctx.moveTo(ex+1.5,ey-1.5);ctx.lineTo(ex-1.5,ey+1.5);ctx.stroke();}return;}
 if(st==='googly'||st==='zgoogly'||st==='sleepy'){for(const [i,dx] of[[0,-3.6],[1,3.6]]){const ex=hx+f*3*s+dx*s,r=(st==='zgoogly'&&i?2.6:3.5)*s;ctx.fillStyle='#fff';circ(ex,ey-1,r);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=.9;ctx.stroke();
   if(st==='sleepy'){ctx.fillStyle=o.skin;ctx.beginPath();ctx.arc(ex,ey-1,r+.6,Math.PI,0);ctx.fill();line([ex-r,ey-1,ex+r,ey-1],INK,1);continue;}
   const lx=st==='zgoogly'&&!i?-f*1.2:f*1.2,ly=st==='zgoogly'&&!i?-1:.6;ctx.fillStyle=INK;circ(ex+lx*s,ey-1+ly*s,(st==='zgoogly'?1.3:1.75)*s);ctx.fill();}
  return;}
 ctx.fillStyle=INK;circ(hx+f*3*s-2.6*s,ey,1.3*s);ctx.fill();circ(hx+f*3*s+2.6*s,ey,1.3*s);ctx.fill();
 if(st==='brow'){line([hx+f*3*s-4.5*s,ey-4.2*s,hx+f*3*s-1*s,ey-3.4*s],INK,1.8*s);line([hx+f*3*s+1*s,ey-3.4*s,hx+f*3*s+4.5*s,ey-4.2*s],INK,1.8*s);ctx.fillStyle='rgba(255,110,120,.45)';ell(hx+f*3*s-5*s,ey+3.5*s,2.4*s,1.5*s);ctx.fill();ell(hx+f*3*s+5.5*s,ey+3.5*s,2.4*s,1.5*s);ctx.fill();}
}

function zface(g,st,o){const {hx,hy,hr,f}=g,s=hr/10,ex=hx+f*3*s,ey=hy+1*s;
 if(st==='zA'){ctx.fillStyle='rgba(70,30,90,.45)';ell(ex-2.8*s,ey+2.2*s,2.6*s,1.4*s);ctx.fill();ell(ex+2.8*s,ey+2.2*s,2.6*s,1.4*s);ctx.fill();
  ctx.fillStyle='#fff';circ(ex-2.8*s,ey,1.9*s);ctx.fill();circ(ex+2.8*s,ey,1.9*s);ctx.fill();ctx.fillStyle='#c0392b';circ(ex-2.6*s,ey,.9*s);ctx.fill();circ(ex+3*s,ey,.9*s);ctx.fill();
  line([ex-5*s,ey-4.6*s,ex-1*s,ey-2.6*s],INK,1.9*s);line([ex+1*s,ey-2.6*s,ex+5*s,ey-4.6*s],INK,1.9*s);
  ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(ex,ey+6*s,3*s,2*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(ex-1.6*s,ey+4.2*s,1.4*s,1.6*s);ctx.fillRect(ex+.6*s,ey+4.2*s,1.4*s,1.8*s);return;}
 if(st==='zB'){ctx.fillStyle='#fff';circ(ex-3.2*s,ey-.5*s,3.6*s);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=.9;ctx.stroke();ctx.fillStyle=INK;circ(ex-2.4*s,ey+.6*s,1*s);ctx.fill();circ(ex+3.2*s,ey,1.2*s);ctx.fill();
  line([ex+1.2*s,ey-2.8*s,ex+5*s,ey-2*s],INK,1.7*s);line([ex-6*s,ey-5.5*s,ex-1*s,ey-5.8*s],INK,1.7*s);
  ctx.fillStyle=INK;ell(ex+.5*s,ey+5.5*s,2.6*s,1.6*s);ctx.fill();ctx.fillStyle='#e05a6a';ell(ex+1.2*s,ey+7.4*s,1.5*s,2.2*s);ctx.fill();
  ctx.strokeStyle='#3a2412';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(hx-f*6*s,hy-8*s);ctx.lineTo(hx-f*1*s,hy-9.5*s);ctx.stroke();for(let k=0;k<3;k++)line([hx-f*(5-k*2)*s,hy-10*s,hx-f*(5-k*2)*s,hy-7.6*s],'#3a2412',1);return;}
 if(st==='zC'){for(const dx of[-2.8,2.8]){ctx.fillStyle='#fff';circ(ex+dx*s,ey,2.2*s);ctx.fill();ctx.fillStyle=INK;circ(ex+dx*s+f*.5*s,ey+.6*s,1.1*s);ctx.fill();ctx.fillStyle=o.skin;ctx.beginPath();ctx.arc(ex+dx*s,ey,2.6*s,Math.PI,0);ctx.fill();line([ex+dx*s-2.4*s,ey,ex+dx*s+2.4*s,ey],INK,1);}
  line([ex-5*s,ey-3*s,ex-1.2*s,ey-4.6*s],INK,1.7*s);line([ex+1.2*s,ey-4.6*s,ex+5*s,ey-3*s],INK,1.7*s);
  ctx.strokeStyle=INK;ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(ex,ey+3.5*s,2.8*s,.3,Math.PI-.3);ctx.stroke();ctx.fillStyle='#bfe8ff';ell(ex+f*1.8*s,ey+8*s,1.1*s,1.8*s);ctx.fill();return;}
}
function mouth(g,m){if(!m)return;const {hx,hy,hr,f}=g,s=hr/10,mx=hx+f*3*s,my=hy+5.2*s;
 if(m==='smile'){ctx.strokeStyle=INK;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(mx,my-1.5*s,2.6*s,.2,Math.PI-.2);ctx.stroke();}
 if(m==='grin'){ctx.fillStyle=INK;ctx.beginPath();ctx.arc(mx,my-1*s,3.6*s,0,Math.PI);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(mx-3*s,my-1*s,6*s,1.4*s);}
 if(m==='smug'){line([mx-3*s,my,mx+1*s,my,mx+3.5*s,my-2*s],INK,1.3);}
 if(m==='o'){ctx.fillStyle=INK;ell(mx,my,1.6*s,2*s);ctx.fill();}
 if(m==='frown'){ctx.strokeStyle=INK;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(mx,my+2*s,2.6*s,Math.PI+.3,-.3);ctx.stroke();}
 if(m==='duck'){ctx.fillStyle='#ff5ea8';ell(mx+f*1,my,2.6*s,1.8*s);ctx.fill();}
 if(m==='yell'){ctx.fillStyle=INK;ell(mx,my+.5,2.6*s,3*s);ctx.fill();ctx.fillStyle='#e05a6a';ell(mx,my+1.8*s,1.6*s,1.2*s);ctx.fill();}
}
/* hats & props */
function strawHat(g,dy){const {hx,hy,hr}=g;dy=dy||0;ctx.fillStyle='#e9c46a';ell(hx,hy-hr*.55+dy,hr*1.75,hr*.45);ctx.fill();ell(hx,hy-hr*.95+dy,hr*.95,hr*.6);ctx.fill();ctx.fillStyle='#c0392b';ctx.fillRect(hx-hr*.95,hy-hr*.85+dy,hr*1.9,2.5);}
function capHat(g,c,dy,txt){const {hx,hy,hr,f}=g;dy=dy||0;ctx.fillStyle=c;ctx.beginPath();ctx.arc(hx,hy-hr*.4+dy,hr,Math.PI,0);ctx.fill();ell(hx+f*hr*.8,hy-hr*.4+dy,hr*.8,hr*.3);ctx.fill();if(txt)text(txt,hx,hy-hr*.85+dy,7,'#fff');}
function toque(g,dy){const {hx,hy,hr}=g;dy=dy||0;ctx.fillStyle='#fff';rr(hx-hr*.8,hy-hr*2.1+dy,hr*1.6,hr*1.4,3);ctx.fill();circ(hx-hr*.55,hy-hr*2.1+dy,hr*.6);ctx.fill();circ(hx+hr*.55,hy-hr*2.1+dy,hr*.6);ctx.fill();circ(hx,hy-hr*2.45+dy,hr*.65);ctx.fill();ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.strokeRect(hx-hr*.8,hy-hr*.95+dy,hr*1.6,.1);}
function hardHat(g,dy){const {hx,hy,hr}=g;dy=dy||0;ctx.fillStyle='#f2c230';ctx.beginPath();ctx.arc(hx,hy-hr*.35+dy,hr*1.02,Math.PI,0);ctx.fill();ctx.fillRect(hx-hr*1.3,hy-hr*.4+dy,hr*2.6,3);ctx.fillStyle='#d9a21b';ctx.fillRect(hx-1.5,hy-hr*1.35+dy,3,hr);}
function topHat(g,dy,sc){const {hx,hy,hr}=g;dy=dy||0;sc=sc||1;ctx.fillStyle='#1b1b2b';ell(hx,hy-hr*.75+dy,hr*1.5*sc,hr*.38*sc);ctx.fill();rr(hx-hr*.9*sc,hy-hr*(.75+2.2*sc)+dy,hr*1.8*sc,hr*2.2*sc,2);ctx.fill();ctx.fillStyle='#c0392b';ctx.fillRect(hx-hr*.9*sc,hy-hr*(.75+.5*sc)+dy,hr*1.8*sc,3*sc);}
function shades(g,c){const {hx,hy,hr,f}=g,s=hr/10;ctx.fillStyle=c||'#111';rr(hx+f*3*s-7.5*s,hy-2.5*s,7*s,4.5*s,2);ctx.fill();rr(hx+f*3*s+.5*s,hy-2.5*s,7*s,4.5*s,2);ctx.fill();ctx.fillRect(hx-hr,hy-2*s,hr*2,1.4);}
function glasses(g){const {hx,hy,hr,f}=g,s=hr/10;ctx.strokeStyle=INK;ctx.lineWidth=1.3;circ(hx+f*3*s-3.6*s,hy,3.4*s);ctx.stroke();circ(hx+f*3*s+3.6*s,hy,3.4*s);ctx.stroke();}
function nametag(g,t,c){const {x,top}=g;ctx.fillStyle='#fff';rr(x-9,top+4,11,6,1.5);ctx.fill();text(t,x-3.5,top+7,4.5,c||'#c0392b');}
function sashText(g,t){const {x,top,bodyW,bodyH}=g;ctx.save();ctx.translate(x,top+bodyH/2);ctx.rotate(Math.atan2(bodyH,bodyW));text(t,0,0,4.2,'#c0392b');ctx.restore();}
function overalls(g,c){const {x,top,bodyW,bodyH}=g;ctx.fillStyle=c;rr(x-bodyW/2+2,top+bodyH*.45,bodyW-4,bodyH*.55+2,3);ctx.fill();ctx.fillRect(x-bodyW/2+3,top+1,3,bodyH*.5);ctx.fillRect(x+bodyW/2-6,top+1,3,bodyH*.5);ctx.fillStyle='#f2c230';circ(x-bodyW/2+4.5,top+bodyH*.47,1.3);ctx.fill();circ(x+bodyW/2-4.5,top+bodyH*.47,1.3);ctx.fill();}
function apron(g){const {x,top,bodyW,bodyH}=g;ctx.fillStyle='#fff';rr(x-bodyW/2+2,top+4,bodyW-4,bodyH+6,4);ctx.fill();ctx.fillStyle='rgba(230,200,150,.8)';circ(x+3,top+14,2.2);ctx.fill();circ(x-4,top+19,1.6);ctx.fill();}
function cane(g,side){const {x,y,f,top}=g;side=side||f;line([x+side*14,y,x+side*14,top+10],'#6b4423',2.5);ctx.strokeStyle='#6b4423';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x+side*10,top+10,4,Math.PI,0);ctx.stroke();}
function hawaii(g){const {x,top,bodyW,bodyH}=g;ctx.save();rr(x-bodyW/2,top,bodyW,bodyH,7);ctx.clip();const cs=['#ffd35a','#ff8fb8','#fff'];for(let i=0;i<7;i++){ctx.fillStyle=cs[i%3];circ(x-bodyW/2+3+((i*7)%bodyW),top+3+((i*11)%bodyH),2);ctx.fill();}ctx.restore();}
function cowPrint(g){const {x,top,bodyW,bodyH}=g;ctx.save();ctx.beginPath();ctx.rect(x-bodyW/2,top+bodyH*.4,bodyW,bodyH+20);ctx.clip();ctx.fillStyle='#222';for(const s of[[-5,10,4,3],[4,15,3,4],[-2,22,5,3],[5,26,3,2]]){ell(x+s[0],top+s[1],s[2],s[3]);ctx.fill();}ctx.restore();}

/* cow head for Grandpa Bovine (from drawCow) */
function cowHead(g,o){const {hx,hy,f}=g,s=(o&&o.s)||1;
 ctx.fillStyle='#f3e3c3';ctx.beginPath();ctx.moveTo(hx-5*s,hy-8*s);ctx.lineTo(hx-9*s,hy-16*s);ctx.lineTo(hx-1*s,hy-9*s);ctx.fill();ctx.beginPath();ctx.moveTo(hx+5*s,hy-8*s);ctx.lineTo(hx+9*s,hy-16*s);ctx.lineTo(hx+1*s,hy-9*s);ctx.fill();
 ctx.fillStyle='#fbfbfb';ell(hx-11*s,hy-4*s,5*s,2.6*s,-.4);ctx.fill();ell(hx+11*s,hy-4*s,5*s,2.6*s,.4);ctx.fill();
 ctx.fillStyle='#fbfbfb';ell(hx,hy,11*s,11*s);ctx.fill();ctx.fillStyle='#2b2b2b';ell(hx-f*4*s,hy-5*s,5*s,4*s);ctx.fill();
 ctx.fillStyle='#f4a3b4';ell(hx+f*2*s,hy+6*s,8*s,5.5*s);ctx.fill();ctx.fillStyle='#b05a6a';circ(hx+f*2*s-3*s,hy+6*s,1.2*s);ctx.fill();circ(hx+f*2*s+3*s,hy+6*s,1.2*s);ctx.fill();
